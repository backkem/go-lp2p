name: osp-app

on:
  push:
    paths:
      - "osp-app/**"
      - "lp2p-shim/dist/types/**"
      - ".github/workflows/osp-app.yml"
  pull_request:
    paths:
      - "osp-app/**"
      - "lp2p-shim/dist/types/**"
      - ".github/workflows/osp-app.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: osp-app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: osp-app/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Checked-in bundle matches a fresh build
        run: npm run check-dist

      - name: Node example
        run: npm run example
